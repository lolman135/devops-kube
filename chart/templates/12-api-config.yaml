apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: shop
data:
  default.conf: |
    server {
      listen 80;
      location /healthz {return 200 'ok';}
      location / {
        default_type application/json;
        return 200 '{"service": "api", "version": "{{ .Chart.AppVersion }}"}';
      }
      location /nope {return 404 'not found';}
    }
